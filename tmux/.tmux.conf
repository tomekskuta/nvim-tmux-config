unbind r
bind r source-file ~/.tmux.conf
set -g mouse on
set -g base-index 1
set -g prefix C-Space
set -g status-position top
set -g status-left ""
set -g status-left-length 200
set -g status-right-length 200

# pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# splits
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vi mode
set -g mode-keys vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

# continuum
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'iterm,fullscreen'
set -g @continuum-save-interval '60'
set -g @continuum-restore 'on'

# catppuccin — all options BEFORE run
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_fill "all"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_current_background "#{@thm_mauve}"
set -g @catppuccin_pane_left_separator ""
set -g @catppuccin_pane_middle_separator "█"
set -g @catppuccin_pane_right_separator ""
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{s|.*/Documents/projects|🛠️ |:pane_current_path}"

# TPM — must stay here
run '~/.tmux/plugins/tpm/tpm'

# status-right AFTER run, so catppuccin module variables exist
set -g status-right "#{E:@catppuccin_status_directory} #{E:@catppuccin_status_session} #{E:@catppuccin_status_date_time}"
